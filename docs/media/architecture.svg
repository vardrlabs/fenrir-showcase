      </g>
      <g font-size="10.5" text-anchor="middle" fill="#5c6b78">
        <text x="450" y="505">each bay detaches with two connectors and four bolts · rejoin is recalibration-free (output-shaft encoder)</text>
        <text x="450" y="525">twelve self-announcing GIM6010-class nodes · one seven-state health vocabulary, firmware to UI</text>
      </g>

    </g>
  </g>
</svg>
