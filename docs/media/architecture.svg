        <path d="M284 390 V300 M330 390 V300 M376 390 V300"/>
        <path d="M524 390 V300 M570 390 V300 M616 390 V300"/>
        <path d="M704 390 V300 M750 390 V300 M796 390 V300"/>
      </g>
      <g fill="none" stroke="#9db0bf" stroke-width="1.4">
        <rect x="91" y="390" width="26" height="26"/>
        <rect x="137" y="390" width="26" height="26"/>
        <rect x="183" y="390" width="26" height="26"/>
        <rect x="271" y="390" width="26" height="26"/>
        <rect x="317" y="390" width="26" height="26"/>
        <rect x="363" y="390" width="26" height="26"/>
        <rect x="511" y="390" width="26" height="26"/>
        <rect x="557" y="390" width="26" height="26"/>
