        <rect x="783" y="390" width="26" height="26"/>
      </g>
      <g fill="none" stroke="#e89055" stroke-width="1.5">
        <circle cx="214" cy="346" r="5"/>
        <circle cx="394" cy="346" r="5"/>
        <circle cx="634" cy="346" r="5"/>
        <circle cx="814" cy="346" r="5"/>
      </g>

      <g font-size="13" text-anchor="middle" fill="#e9eef3">
        <text x="450" y="56">LAYER 3 · COGNITION</text>
        <text x="450" y="174">LAYER 2 · REAL-TIME</text>
      </g>
      <g font-size="11.5" text-anchor="middle" fill="#8fa0ae">
        <text x="450" y="76">Raspberry Pi 5 + AI HAT+ 2 (Hailo-10H) · ROS 2</text>
        <text x="450" y="194">Teensy 4.1 · bus master + safety supervisor</text>
      </g>
      <g font-size="10.5" text-anchor="middle" fill="#5c6b78">
        <text x="450" y="96">local vision · voice · intent grammar · Skill Registry · telemetry API</text>
        <text x="450" y="214">node discovery · health registry · IMU fusion · joint commands · bay LEDs</text>
      </g>
      <g font-size="10.5" fill="#e89055">
        <text x="462" y="133" text-anchor="start">commands / telemetry</text>
      </g>
      <g font-size="11" fill="#8fa0ae">
        <text x="60" y="290" text-anchor="start">CAN L · left legs</text>
        <text x="840" y="290" text-anchor="end">CAN R · right legs</text>
      </g>
      <g font-size="11" fill="#e9eef3">
        <text x="82" y="352" text-anchor="start">FL</text>
        <text x="262" y="352" text-anchor="start">RL</text>
        <text x="502" y="352" text-anchor="start">FR</text>
        <text x="682" y="352" text-anchor="start">RR</text>
      </g>
      <g font-size="10" text-anchor="middle" fill="#5c6b78">
        <text x="150" y="440">hip · thigh · knee</text>
