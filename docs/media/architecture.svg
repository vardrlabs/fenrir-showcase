<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
  <title id="t">FENRIR architecture — three layers, two CAN buses, four hot-swap bays</title>
  <desc id="d">Layer 3 cognition on a Raspberry Pi 5 with AI HAT+ 2 running ROS 2; Layer 2 real-time on a Teensy 4.1 acting as bus master and safety supervisor; Layer 1 twelve smart actuators as self-announcing nodes split across two CAN buses by body side, grouped into four hot-swap leg bays of three joints each, every bay carrying a status LED.</desc>

  <rect x="0" y="0" width="900" height="600" fill="#0b0f13"/>

  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <text x="450" y="34" text-anchor="middle" font-size="14" fill="#e9eef3" letter-spacing="1.2">FENRIR — THREE LAYERS, TWO BUSES, FOUR HOT-SWAP BAYS</text>

    <g transform="translate(0,46)">

      <g fill="none" stroke="#9db0bf" stroke-width="1.5">
        <rect x="150" y="28" width="600" height="84"/>
        <rect x="150" y="146" width="600" height="84"/>
      </g>
      <g fill="none" stroke="#e89055" stroke-width="1.4">
        <path d="M450 112 V146"/>
        <path d="M300 230 V300 M600 230 V300"/>
      </g>
      <g fill="none" stroke="#9db0bf" stroke-width="1.5">
        <path d="M60 300 H420"/>
        <path d="M480 300 H840"/>
      </g>
      <g fill="none" stroke="#e89055" stroke-width="1.4" stroke-dasharray="6 5">
