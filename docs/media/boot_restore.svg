<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" role="img" aria-label="Position reported by three actuators over the first 2.2 seconds after power-up. Each spends 1.5 seconds booting, goes idle, then its position jumps by whole motor turns as the power-on restore lands. The bench firmware had already declared every unit ready, before any of it." font-family="'IBM Plex Mono', SFMono-Regular, Menlo, monospace">
